# Render Blueprint specification for DocuMind AI
# Automatically configures Build Command and Start Command on Render
services:
  - type: web
    name: documind-ai
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
